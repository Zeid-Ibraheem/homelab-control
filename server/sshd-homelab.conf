# Installé dans /etc/ssh/sshd_config.d/50-homelab.conf par server/install.sh.
#
# Le compte « homelab » ne peut faire qu'une chose : lancer le script homelab.
# Même si une clé était ajoutée sans restriction dans son authorized_keys,
# SSH imposerait quand même cette commande, sans terminal ni tunnel.
Match User homelab
    ForceCommand /usr/local/bin/homelab
    AuthenticationMethods publickey
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no

# Fin du bloc : les réglages suivants s'appliquent de nouveau à tout le monde.
Match all
