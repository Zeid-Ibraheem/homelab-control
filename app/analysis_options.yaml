# Règles d'analyse du code : celles recommandées par Flutter, plus quelques
# règles de sûreté.
analyzer:
  exclude:
    - build/**
    - android/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - unawaited_futures
