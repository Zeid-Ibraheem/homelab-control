name: homelab_control
description: Télécommande SSH d'un homelab (serveur toujours allumé et tour allumée à la demande).
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Client SSH écrit entièrement en Dart.
  dartssh2: ^2.11.0
  # Ed25519, pour créer la clé de l'application ; déjà utilisé par dartssh2,
  # qui en fixe la version.
  pinenacl: any
  # Stockage chiffré d'Android (clé de chiffrement gardée par le Keystore).
  flutter_secure_storage: ^9.2.2
  # Verrou de l'application : empreinte digitale ou code du téléphone.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
