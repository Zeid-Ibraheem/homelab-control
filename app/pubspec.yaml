name: homelab_control
description: Télécommande SSH d'un homelab (serveur toujours allumé et tour allumée à la demande).
publish_to: 'none'
version: 0.7.0+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Client SSH écrit entièrement en Dart. Version 4 au moins : protection contre
  # l'attaque Terrapin (échange de clés strict), refus d'une clé de machine qui
  # change en cours de connexion, vérifications cryptographiques renforcées.
  dartssh2: ^4.0.1
  # Ed25519, pour créer la clé de l'application (même version que dartssh2).
  pinenacl: ^0.6.0
  # Stockage chiffré d'Android : AES-GCM, clé protégée par le Keystore.
  flutter_secure_storage: ^11.2.0
  # Verrou de l'application : empreinte digitale ou code du téléphone.
  local_auth: ^3.0.2
  # Terminal (affichage et clavier), prévu pour dartssh2.
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
